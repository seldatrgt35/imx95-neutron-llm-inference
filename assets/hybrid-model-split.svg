<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="500" viewBox="0 0 1110 500"><rect width="1110" height="500" fill="#f5f7f9"/><text x="48" y="60" fill="#162538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">EXPERIMENTAL QWEN3-4B HYBRID GRAPH PARTITION</text><text x="48" y="85" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Graph partition idea, not a validated deployed inference engine</text><rect x="48" y="142" width="250" height="86" rx="8" fill="#ffffff" stroke="#dce3e9" stroke-width="1"/><text x="173" y="179" fill="#162538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">INPUTS</text><text x="173" y="202" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">tokens, positions, past KV</text><rect x="370" y="122" width="290" height="130" rx="8" fill="#ffffff" stroke="#dce3e9" stroke-width="1"/><text x="515" y="165" fill="#2c5b89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">PREFIX: LAYERS 0-3</text><text x="515" y="195" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">Neutron candidate + CPU fallback</text><text x="515" y="219" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">KV cache outputs 0-3</text><rect x="732" y="122" width="325" height="130" rx="8" fill="#ffffff" stroke="#dce3e9" stroke-width="1"/><text x="892" y="165" fill="#207b75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">SUFFIX: LAYERS 4-35</text><text x="892" y="195" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">CPU execution candidate</text><text x="892" y="219" fill="#596775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle">logits + KV cache outputs 4-35</text><path d="M300 185 H367" fill="none" stroke="#2c5b89" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M662 185 H729" fill="none" stroke="#207b75" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="370" y="308" width="687" height="140" rx="10" fill="#fff9f6" stroke="#dfb9b5" stroke-width="1"/><text x="393" y="341" fill="#a3433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">OPEN ENGINEERING ISSUES</text><text x="393" y="370" fill="#162538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Two boundary tensors, shared computations (11 nodes), external-data linkage</text><text x="393" y="401" fill="#162538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Custom ONNX op validation and autoregressive KV-cache correctness</text><text x="393" y="430" fill="#a3433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">Successful end-to-end split inference has not been demonstrated.</text><path d="M700 252 V305" fill="none" stroke="#a3433f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/></svg>