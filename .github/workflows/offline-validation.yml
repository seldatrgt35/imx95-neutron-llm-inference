name: Offline archive validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax
        run: python -m compileall -q scripts src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify archived public evidence hashes
        run: python scripts/verify_evidence_manifest.py
      - name: Regenerate ORT placement summary
        run: python scripts/analyze_neutron_ort_log.py evidence/terminal/20261112-113926-qwen-ort-verbose-253-neutron-nodes.log
